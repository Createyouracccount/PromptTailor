[project]
name = "prompt-tailor"
version = "0.2.3"
description = "Model-aware prompt refinement tool for Claude Code users"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []
keywords = ["claude", "claude-code", "prompt", "prompt-engineering", "mcp"]

[project.optional-dependencies]
api = ["anthropic"]

[project.urls]
Repository = "https://github.com/Createyouracccount/PromptTailor"
Issues = "https://github.com/Createyouracccount/PromptTailor/issues"

[project.scripts]
prompt-tailor = "prompt_tailor.cli:main"
prompt-tailor-mcp = "prompt_tailor.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prompt_tailor*"]

[tool.setuptools.package-data]
prompt_tailor = ["profiles/*.md", "profiles/condensed/*.md"]
